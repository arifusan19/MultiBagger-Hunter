name: Test Search IDX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test API Search
        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}

        run: |

          python3 - <<'PY'

          import requests
          import json
          import os

          API_KEY = os.environ["API_KEY"]

          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }

          print("======================================")
          print("TEST API SEARCH")
          print("======================================")

          url = f"{BASE}/api/search"

          print("URL:", url)
          print("")

          r = requests.get(
              url,
              headers=HEADERS,
              timeout=60
          )

          print("HTTP:", r.status_code)
          print("")

          print("RESPONSE:")
          print(r.text[:20000])

          print("")
          print("======================================")

          PY
