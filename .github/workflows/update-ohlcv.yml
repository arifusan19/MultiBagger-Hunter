name: Update OHLCV

on:
  workflow_dispatch:

  schedule:
    - cron: "15 17 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil semua saham dan OHLCV
        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}
        run: |
          python3 - <<'PY'
          import requests
          import json
          import os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          API_KEY = os.environ["API_KEY"]
          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }

          os.makedirs("data", exist_ok=True)

          # ==========================================
          # 1. AMBIL DAFTAR SAHAM
          # ==========================================

          print("======================================")
          print("MULTIBAGGER HUNTER")
          print("======================================")
          print("[1/3] Mengambil daftar saham...")

          r = requests.get(
              f"{BASE}/api/market-cap",
              headers=HEADERS,
              timeout=60
          )

          print("HTTP:", r.status_code)

          r.raise_for_status()

          market = r.json()

          # Simpan response mentah untuk pemeriksaan
          with open(
              "data/market_cap_raw.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  market,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==========================================
          # CARI FIELD code DI SELURUH JSON
          # ==========================================

          codes = set()

          def collect_codes(obj):

              if isinstance(obj, dict):

                  # Prioritas field kode saham
                  for key in [
                      "code",
                      "stock_code",
                      "symbol",
                      "ticker"
                  ]:

                      value = obj.get(key)

                      if isinstance(value, str):

                          code = value.strip().upper()

                          if (
                              2 <= len(code) <= 5
                              and code.isalpha()
                          ):
                              codes.add(code)

                  # Telusuri semua isi object
                  for value in obj.values():
                      collect_codes(value)

              elif isinstance(obj, list):

                  for item in obj:
                      collect_codes(item)

          collect_codes(market)

          codes = sorted(codes)

          print("")
          print("JUMLAH KODE SAHAM:", len(codes))
          print("")

          print("Contoh kode:")

          print(codes[:50])

          print("")

          if not codes:

              print("ERROR: Tidak menemukan kode saham.")

              raise SystemExit(1)

          # ==========================================
          # 2. AMBIL HISTORY
          # ==========================================

          print("[2/3] Mengambil OHLCV...")

          result = {}

          def get_history(code):

              try:

                  url = f"{BASE}/api/history/{code}"

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=60
                  )

                  if response.status_code != 200:

                      return (
                          code,
                          None,
                          f"HTTP {response.status_code}"
                      )

                  return (
                      code,
                      response.json(),
                      None
                  )

              except Exception as e:

                  return (
                      code,
                      None,
                      str(e)
                  )

          success = 0
          failed = 0

          # Batasi koneksi agar tidak menghantam quota terlalu agresif
          with ThreadPoolExecutor(
              max_workers=5
          ) as executor:

              futures = {
                  executor.submit(
                      get_history,
                      code
                  ): code

                  for code in codes
              }

              for i, future in enumerate(
                  as_completed(futures),
                  1
              ):

                  code, data, error = future.result()

                  if data is not None:

                      result[code] = data
                      success += 1

                  else:

                      failed += 1

                      print(
                          f"GAGAL {code}: {error}"
                      )

                  if (
                      i % 25 == 0
                      or i == len(codes)
                  ):

                      print(
                          f"Progress: "
                          f"{i}/{len(codes)} "
                          f"| sukses: {success} "
                          f"| gagal: {failed}"
                      )

          # ==========================================
          # 3. SIMPAN
          # ==========================================

          print("")
          print("[3/3] Menyimpan data...")

          with open(
              "data/ohlcv.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("")
          print("======================================")
          print("SELESAI")
          print("======================================")
          print("Total kode :", len(codes))
          print("Berhasil   :", success)
          print("Gagal      :", failed)
          print("======================================")

          PY

      - name: Commit data OHLCV
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ohlcv.json data/market_cap_raw.json

          git diff --cached --quiet || \
            git commit -m "Update OHLCV data"

          git push
