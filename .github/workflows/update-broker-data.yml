name: Update Broker Data

on:
  workflow_dispatch:

  schedule:
    # 19:30 WIB = 12:30 UTC
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download broker data
        env:
          IDX_EDGE_API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}

        run: |

          python - <<'PY'

          import os
          import json
          import time
          import requests
          from datetime import date, timedelta


          # =====================================================
          # CONFIG
          # =====================================================

          API_KEY = os.environ.get("IDX_EDGE_API_KEY")

          if not API_KEY:
              raise RuntimeError(
                  "Secret IDX_EDGE_API_KEY belum tersedia."
              )


          BASE_URL = "https://stock.arjum.com"


          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }


          session = requests.Session()
          session.headers.update(HEADERS)


          # =====================================================
          # PERIODE DATA
          # 24 BULAN
          # =====================================================

          end_date = date.today()

          start_date = (
              end_date -
              timedelta(days=730)
          )


          print(
              "Periode:",
              start_date.isoformat(),
              "->",
              end_date.isoformat()
          )


          # =====================================================
          # 1. AMBIL DAFTAR EMITEN
          # =====================================================

          print("")
          print("Mengambil daftar emiten...")


          response = session.get(
              BASE_URL + "/api/market-cap",
              timeout=60
          )


          print(
              "HTTP market-cap:",
              response.status_code
          )


          if response.status_code != 200:

              print(response.text[:3000])

              raise RuntimeError(
                  "Gagal mengambil daftar emiten."
              )


          market_data = response.json()


          # =====================================================
          # 2. EXTRACT KODE SAHAM
          # =====================================================

          codes = set()


          def extract_codes(obj):

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      key_name = str(key).lower()

                      if key_name in (
                          "code",
                          "ticker",
                          "symbol",
                          "stock_code",
                          "stockcode"
                      ):

                          if isinstance(value, str):

                              candidate = (
                                  value
                                  .strip()
                                  .upper()
                              )


                              if (
                                  len(candidate) == 4
                                  and candidate.isalpha()
                              ):

                                  codes.add(candidate)


                      extract_codes(value)


              elif isinstance(obj, list):

                  for item in obj:

                      extract_codes(item)


          extract_codes(
              market_data
          )


          codes = sorted(codes)


          print(
              "Total emiten ditemukan:",
              len(codes)
          )


          if not codes:

              raise RuntimeError(
                  "Tidak ada kode emiten yang ditemukan."
              )


          # =====================================================
          # 3. OUTPUT
          # =====================================================

          output = {

              "source":
                  "IDX Edge PRO",

              "updated_at":
                  date.today().isoformat(),

              "start_date":
                  start_date.isoformat(),

              "end_date":
                  end_date.isoformat(),

              "stocks": {}

          }


          success = 0

          failed = []


          # =====================================================
          # 4. AMBIL BROKER SUMMARY
          # =====================================================

          for index, code in enumerate(
              codes,
              start=1
          ):


              print("")
              print(
                  f"[{index}/{len(codes)}] {code}"
              )


              url = (
                  BASE_URL +
                  "/api/broker-summary/" +
                  code
              )


              params = {

                  "start_date":
                      start_date.isoformat(),

                  "end_date":
                      end_date.isoformat(),

                  "broker_limit":
                      100,

                  "level_limit":
                      100,

                  "all_data":
                      "true",

                  "flow":
                      "all",

                  "net":
                      "false"

              }


              try:


                  result = session.get(
                      url,
                      params=params,
                      timeout=60
                  )


                  if result.status_code == 429:

                      print(
                          "RATE LIMIT tercapai."
                      )

                      failed.append({

                          "ticker": code,

                          "error":
                              "rate_limit"

                      })

                      break


                  if result.status_code != 200:

                      print(
                          "HTTP:",
                          result.status_code
                      )

                      print(
                          result.text[:500]
                      )

                      failed.append({

                          "ticker": code,

                          "error":
                              "HTTP " +
                              str(
                                  result.status_code
                              )

                      })

                      continue


                  payload = result.json()


                  # -------------------------------------------------
                  # BROKER MAP
                  # -------------------------------------------------

                  broker_map = {}


                  # -------------------------------------------------
                  # BROKER SUMMARY
                  # -------------------------------------------------

                  for broker in payload.get(
                      "brokers",
                      []
                  ):


                      broker_code = broker.get(
                          "broker_code"
                      )


                      if not broker_code:
                          continue


                      broker_map[
                          broker_code
                      ] = {

                          "broker":
                              broker_code,

                          "broker_name":
                              broker.get(
                                  "broker_name",
                                  ""
                              ),

                          "bval":
                              broker.get(
                                  "bval",
                                  0
                              ),

                          "bvol":
                              broker.get(
                                  "bvol",
                                  0
                              ),

                          "bfrq":
                              broker.get(
                                  "bfrq",
                                  0
                              ),

                          "sval":
                              broker.get(
                                  "sval",
                                  0
                              ),

                          "svol":
                              broker.get(
                                  "svol",
                                  0
                              ),

                          "sfrq":
                              broker.get(
                                  "sfrq",
                                  0
                              ),

                          "nval":
                              broker.get(
                                  "nval",
                                  0
                              ),

                          "nvol":
                              broker.get(
                                  "nvol",
                                  0
                              ),

                          "bavg":
                              None,

                          "savg":
                              None

                      }


                  # -------------------------------------------------
                  # BUY / SELL LEVELS
                  # Mengisi B.Avg dan S.Avg
                  # -------------------------------------------------

                  for level in payload.get(
                      "broker_levels",
                      []
                  ):


                      buy =
                          level.get(
                              "buy"
                          ) or {}


                      sell =
                          level.get(
                              "sell"
                          ) or {}


                      buy_code =
                          buy.get(
                              "broker_code"
                          )


                      sell_code =
                          sell.get(
                              "broker_code"
                          )


                      # -----------------------------
                      # BUY
                      # -----------------------------

                      if buy_code:


                          if buy_code not in broker_map:

                              broker_map[
                                  buy_code
                              ] = {

                                  "broker":
                                      buy_code,

                                  "broker_name":
                                      buy.get(
                                          "broker_name",
                                          ""
                                      ),

                                  "bval":
                                      buy.get(
                                          "bval",
                                          0
                                      ),

                                  "bvol":
                                      buy.get(
                                          "bvol",
                                          0
                                      ),

                                  "bfrq":
                                      buy.get(
                                          "bfrq",
                                          0
                                      ),

                                  "sval":
                                      0,

                                  "svol":
                                      0,

                                  "sfrq":
                                      0,

                                  "nval":
                                      0,

                                  "nvol":
                                      0,

                                  "bavg":
                                      None,

                                  "savg":
                                      None

                              }


                          broker_map[
                              buy_code
                          ][
                              "bavg"
                          ] = buy.get(
                              "bavg"
                          )


                      # -----------------------------
                      # SELL
                      # -----------------------------

                      if sell_code:


                          if sell_code not in broker_map:

                              broker_map[
                                  sell_code
                              ] = {

                                  "broker":
                                      sell_code,

                                  "broker_name":
                                      sell.get(
                                          "broker_name",
                                          ""
                                      ),

                                  "bval":
                                      0,

                                  "bvol":
                                      0,

                                  "bfrq":
                                      0,

                                  "sval":
                                      sell.get(
                                          "sval",
                                          0
                                      ),

                                  "svol":
                                      sell.get(
                                          "svol",
                                          0
                                      ),

                                  "sfrq":
                                      sell.get(
                                          "sfrq",
                                          0
                                      ),

                                  "nval":
                                      0,

                                  "nvol":
                                      0,

                                  "bavg":
                                      None,

                                  "savg":
                                      None

                              }


                          broker_map[
                              sell_code
                          ][
                              "savg"
                          ] = sell.get(
                              "savg"
                          )


                  # -------------------------------------------------
                  # SIMPAN DATA EMITEN
                  # -------------------------------------------------

                  output[
                      "stocks"
                  ][code] = {

                      "stock_code":
                          payload.get(
                              "stock_code",
                              code
                          ),

                      "broker_start_date":
                          payload.get(
                              "broker_start_date"
                          ),

                      "broker_end_date":
                          payload.get(
                              "broker_end_date"
                          ),

                      "broker_date_min":
                          payload.get(
                              "broker_date_min"
                          ),

                      "broker_date_max":
                          payload.get(
                              "broker_date_max"
                          ),

                      "broker_net":
                          payload.get(
                              "broker_net",
                              {}
                          ),

                      "brokers":
                          list(
                              broker_map.values()
                          )

                  }


                  success += 1


                  print(
                      "  OK:",
                      len(broker_map),
                      "broker"
                  )


              except Exception as error:


                  print(
                      "  ERROR:",
                      str(error)
                  )


                  failed.append({

                      "ticker":
                          code,

                      "error":
                          str(error)

                  })


              # jeda kecil
              time.sleep(0.15)


          # =====================================================
          # 5. SUMMARY
          # =====================================================

          output[
              "summary"
          ] = {

              "total_emiten":
                  len(codes),

              "berhasil":
                  success,

              "gagal":
                  len(failed),

              "failed":
                  failed

          }


          # =====================================================
          # 6. SAVE JSON
          # =====================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/broker_live.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("==============================")
          print("UPDATE SELESAI")
          print(
              "Total emiten:",
              len(codes)
          )
          print(
              "Berhasil:",
              success
          )
          print(
              "Gagal:",
              len(failed)
          )
          print("==============================")


          PY


      - name: Save updated data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/broker_live.json

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "Update live broker data"

            git push

          fi
