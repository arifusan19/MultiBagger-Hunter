<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multibagger Hunter</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: end;
        }

        .filter {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            min-width: 150px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        th {
            background: #e5e7eb;
        }

        .positive {
            color: green;
            font-weight: bold;
        }

        .negative {
            color: red;
            font-weight: bold;
        }

        .note {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 MULTIBAGGER HUNTER</h1>
    <p>Broker Accumulation Screener</p>
</header>

<div class="container">

    <div class="box">

        <h2>🔎 Broker Screener</h2>

        <div class="filters">

            <div class="filter">
                <label>Periode</label>

                <select id="period">
                    <option value="1">1 Bulan</option>
                    <option value="3">3 Bulan</option>
                    <option value="6" selected>6 Bulan</option>
                    <option value="12">12 Bulan</option>
                </select>
            </div>


            <div class="filter">
                <label>Saham</label>

                <select id="stock">
                    <option value="ENRG">ENRG</option>
                    <option value="BUMI">BUMI</option>
                    <option value="NCKL">NCKL</option>
                </select>
            </div>


            <button onclick="showBroker()">
                🔎 SCREEN
            </button>

        </div>

    </div>


    <div class="box">

        <h2 id="title">
            ENRG - 6 Bulan
        </h2>

        <p class="note">
            Data di bawah masih DATA CONTOH untuk belajar.
        </p>

        <table>

            <thead>

                <tr>
                    <th>Broker</th>
                    <th>Buy Value</th>
                    <th>Sell Value</th>
                    <th>Net Buy</th>
                    <th>Avg Buy</th>
                    <th>Avg Sell</th>
                </tr>

            </thead>

            <tbody id="brokerTable"></tbody>

        </table>

    </div>

</div>


<script>

const brokerData = {

    1: {
        ENRG: [
            { broker: "RX", buy: 120, sell: 60, avgBuy: 1250, avgSell: 1270 },
            { broker: "LG", buy: 90, sell: 80, avgBuy: 1230, avgSell: 1240 },
            { broker: "YP", buy: 50, sell: 75, avgBuy: 1280, avgSell: 1260 }
        ],
        BUMI: [
            { broker: "RX", buy: 100, sell: 40, avgBuy: 180, avgSell: 185 },
            { broker: "CC", buy: 70, sell: 50, avgBuy: 175, avgSell: 178 }
        ],
        NCKL: [
            { broker: "RX", buy: 200, sell: 100, avgBuy: 1100, avgSell: 1130 },
            { broker: "LG", buy: 120, sell: 90, avgBuy: 1080, avgSell: 1110 }
        ]
    },

    3: {
        ENRG: [
            { broker: "RX", buy: 350, sell: 150, avgBuy: 1210, avgSell: 1260 },
            { broker: "LG", buy: 210, sell: 170, avgBuy: 1190, avgSell: 1220 },
            { broker: "YP", buy: 120, sell: 190, avgBuy: 1240, avgSell: 1210 }
        ],
        BUMI: [
            { broker: "RX", buy: 300, sell: 100, avgBuy: 175, avgSell: 182 },
            { broker: "CC", buy: 180, sell: 120, avgBuy: 170, avgSell: 178 }
        ],
        NCKL: [
            { broker: "RX", buy: 450, sell: 180, avgBuy: 1070, avgSell: 1120 },
            { broker: "LG", buy: 250, sell: 200, avgBuy: 1060, avgSell: 1100 }
        ]
    },

    6: {
        ENRG: [
            { broker: "RX", buy: 850, sell: 420, avgBuy: 1180, avgSell: 1240 },
            { broker: "LG", buy: 620, sell: 580, avgBuy: 1160, avgSell: 1190 },
            { broker: "YP", buy: 300, sell: 510, avgBuy: 1230, avgSell: 1200 }
        ],
        BUMI: [
            { broker: "RX", buy: 700, sell: 300, avgBuy: 170, avgSell: 180 },
            { broker: "CC", buy: 450, sell: 350, avgBuy: 168, avgSell: 175 }
        ],
        NCKL: [
            { broker: "RX", buy: 900, sell: 400, avgBuy: 1050, avgSell: 1110 },
            { broker: "LG", buy: 550, sell: 450, avgBuy: 1030, avgSell: 1080 }
        ]
    },

    12: {
        ENRG: [
            { broker: "RX", buy: 1500, sell: 700, avgBuy: 1100, avgSell: 1210 },
            { broker: "LG", buy: 1100, sell: 900, avgBuy: 1080, avgSell: 1150 },
            { broker: "YP", buy: 600, sell: 1000, avgBuy: 1200, avgSell: 1170 }
        ],
        BUMI: [
            { broker: "RX", buy: 1200, sell: 500, avgBuy: 165, avgSell: 178 },
            { broker: "CC", buy: 800, sell: 600, avgBuy: 160, avgSell: 172 }
        ],
        NCKL: [
            { broker: "RX", buy: 1600, sell: 700, avgBuy: 1000, avgSell: 1100 },
            { broker: "LG", buy: 1000, sell: 800, avgBuy: 980, avgSell: 1060 }
        ]
    }

};


function showBroker() {

    const period =
        document.getElementById("period").value;

    const stock =
        document.getElementById("stock").value;

    const data =
        brokerData[period][stock] || [];

    const table =
        document.getElementById("brokerTable");

    table.innerHTML = "";

    document.getElementById("title").innerText =
        stock + " - " + period + " Bulan";


    data.forEach(item => {

        const netBuy =
            item.buy - item.sell;

        const netClass =
            netBuy >= 0
                ? "positive"
                : "negative";


        table.innerHTML += `

            <tr>

                <td>
                    <b>${item.broker}</b>
                </td>

                <td>
                    Rp ${item.buy} M
                </td>

                <td>
                    Rp ${item.sell} M
                </td>

                <td class="${netClass}">
                    Rp ${netBuy} M
                </td>

                <td>
                    Rp ${item.avgBuy}
                </td>

                <td>
                    Rp ${item.avgSell}
                </td>

            </tr>

        `;

    });

}


showBroker();

</script>

</body>

</html>
