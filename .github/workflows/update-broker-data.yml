name: Update Broker Data

on:
  workflow_dispatch:

  schedule:
    # 19:30 WIB = 12:30 UTC
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download broker data
        env:
          IDX_EDGE_API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}
        run: |
          cat > fetch_broker.py <<'PY'
          import os
          import json
          import time
          import requests
          from datetime import date, timedelta

          API_KEY = os.environ.get("IDX_EDGE_API_KEY")

          if not API_KEY:
              raise RuntimeError(
                  "IDX_EDGE_API_KEY tidak ditemukan."
              )

          BASE_URL = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          # ----------------------------------------
          # PERIODE
          # ----------------------------------------

          end_date = date.today()
          start_date = end_date - timedelta(days=730)

          print(
              f"Periode: {start_date} -> {end_date}"
          )

          # ----------------------------------------
          # AMBIL DAFTAR EMITEN
          # ----------------------------------------

          print("Mengambil daftar emiten...")

          response = session.get(
              f"{BASE_URL}/api/market-cap",
              timeout=60
          )

          print(
              "HTTP market-cap:",
              response.status_code
          )

          if response.status_code != 200:
              print(response.text[:3000])
              raise RuntimeError(
                  "Gagal mengambil daftar emiten."
              )

          market_data = response.json()

          codes = set()

          def find_codes(obj):
              if isinstance(obj, dict):

                  for key, value in obj.items():

                      key_lower = str(key).lower()

                      if key_lower in {
                          "code",
                          "ticker",
                          "symbol",
                          "stock_code",
                          "stockcode"
                      }:

                          if isinstance(value, str):

                              code = value.strip().upper()

                              if (
                                  len(code) == 4
                                  and code.isalpha()
                              ):
                                  codes.add(code)

                      find_codes(value)

              elif isinstance(obj, list):

                  for item in obj:
                      find_codes(item)

          find_codes(market_data)

          codes = sorted(codes)

          print(
              "Total kode emiten:",
              len(codes)
          )

          if not codes:
              raise RuntimeError(
                  "Kode emiten tidak ditemukan."
              )

          # ----------------------------------------
          # OUTPUT
          # ----------------------------------------

          output = {
              "source": "IDX Edge PRO",
              "updated_at": date.today().isoformat(),
              "start_date": start_date.isoformat(),
              "end_date": end_date.isoformat(),
              "stocks": {}
          }

          success = 0
          failed = []

          # ----------------------------------------
          # LOOP EMITEN
          # ----------------------------------------

          for index, code in enumerate(
              codes,
              start=1
          ):

              print(
                  f"[{index}/{len(codes)}] {code}"
              )

              url = (
                  f"{BASE_URL}/api/broker-summary/{code}"
              )

              params = {
                  "start_date":
                      start_date.isoformat(),
                  "end_date":
                      end_date.isoformat(),
                  "all_data":
                      "true",
                  "flow":
                      "all"
              }

              try:

                  r = session.get(
                      url,
                      params=params,
                      timeout=60
                  )

                  if r.status_code == 429:

                      print(
                          "Rate limit tercapai."
                      )

                      failed.append({
                          "ticker": code,
                          "reason": "rate_limit"
                      })

                      break

                  if r.status_code != 200:

                      print(
                          f"HTTP {r.status_code}"
                      )

                      failed.append({
                          "ticker": code,
                          "reason":
                              f"HTTP {r.status_code}"
                      })

                      continue

                  payload = r.json()

                  brokers = {}

                  # --------------------------------
                  # BROKER SUMMARY
                  # --------------------------------

                  broker_list = payload.get(
                      "brokers",
                      []
                  )

                  for item in broker_list:

                      broker_code = item.get(
                          "broker_code"
                      )

                      if not broker_code:
                          continue

                      brokers[broker_code] = {
                          "broker":
                              broker_code,
                          "broker_name":
                              item.get(
                                  "broker_name",
                                  ""
                              ),
                          "bval":
                              item.get(
                                  "bval",
                                  0
                              ),
                          "bvol":
                              item.get(
                                  "bvol",
                                  0
                              ),
                          "bfrq":
                              item.get(
                                  "bfrq",
                                  0
                              ),
                          "sval":
                              item.get(
                                  "sval",
                                  0
                              ),
                          "svol":
                              item.get(
                                  "svol",
                                  0
                              ),
                          "sfrq":
                              item.get(
                                  "sfrq",
                                  0
                              ),
                          "nval":
                              item.get(
                                  "nval",
                                  0
                              ),
                          "nvol":
                              item.get(
                                  "nvol",
                                  0
                              ),
                          "bavg": None,
                          "savg": None
                      }

                  # --------------------------------
                  # BUY / SELL LEVELS
                  # --------------------------------

                  levels = payload.get(
                      "broker_levels",
                      []
                  )

                  for level in levels:

                      buy = level.get("buy") or {}
                      sell = level.get("sell") or {}

                      # BUY

                      buy_code = buy.get(
                          "broker_code"
                      )

                      if buy_code:

                          if buy_code not in brokers:

                              brokers[buy_code] = {
                                  "broker":
                                      buy_code,
                                  "broker_name":
                                      buy.get(
                                          "broker_name",
                                          ""
                                      ),
                                  "bval":
                                      buy.get(
                                          "bval",
                                          0
                                      ),
                                  "bvol":
                                      buy.get(
                                          "bvol",
                                          0
                                      ),
                                  "bfrq":
                                      buy.get(
                                          "bfrq",
                                          0
                                      ),
                                  "sval": 0,
                                  "svol": 0,
                                  "sfrq": 0,
                                  "nval": 0,
                                  "nvol": 0,
                                  "bavg": None,
                                  "savg": None
                              }

                          brokers[buy_code]["bavg"] = \
                              buy.get("bavg")

                      # SELL

                      sell_code = sell.get(
                          "broker_code"
                      )

                      if sell_code:

                          if sell_code not in brokers:

                              brokers[sell_code] = {
                                  "broker":
                                      sell_code,
                                  "broker_name":
                                      sell.get(
                                          "broker_name",
                                          ""
                                      ),
                                  "bval": 0,
                                  "bvol": 0,
                                  "bfrq": 0,
                                  "sval":
                                      sell.get(
                                          "sval",
                                          0
                                      ),
                                  "svol":
                                      sell.get(
                                          "svol",
                                          0
                                      ),
                                  "sfrq":
                                      sell.get(
                                          "sfrq",
                                          0
                                      ),
                                  "nval": 0,
                                  "nvol": 0,
                                  "bavg": None,
                                  "savg": None
                              }

                          brokers[sell_code]["savg"] = \
                              sell.get("savg")

                  # --------------------------------
                  # SIMPAN EMITEN
                  # --------------------------------

                  output["stocks"][code] = {
                      "stock_code": code,
                      "broker_start_date":
                          payload.get(
                              "broker_start_date"
                          ),
                      "broker_end_date":
                          payload.get(
                              "broker_end_date"
                          ),
                      "broker_date_min":
                          payload.get(
                              "broker_date_min"
                          ),
                      "broker_date_max":
                          payload.get(
                              "broker_date_max"
                          ),
                      "broker_net":
                          payload.get(
                              "broker_net",
                              {}
                          ),
                      "brokers":
                          list(
                              brokers.values()
                          )
                  }

                  success += 1

                  print(
                      "  OK -",
                      len(brokers),
                      "broker"
                  )

              except Exception as exc:

                  print(
                      "  ERROR:",
                      str(exc)
                  )

                  failed.append({
                      "ticker": code,
                      "reason": str(exc)
                  })

              time.sleep(0.15)

          # ----------------------------------------
          # SUMMARY
          # ----------------------------------------

          output["summary"] = {
              "total_emiten":
                  len(codes),
              "berhasil":
                  success,
              "gagal":
                  len(failed),
              "failed":
                  failed
          }

          # ----------------------------------------
          # SAVE
          # ----------------------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/broker_live.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("==============================")
          print("UPDATE SELESAI")
          print(
              "Total:",
              len(codes)
          )
          print(
              "Berhasil:",
              success
          )
          print(
              "Gagal:",
              len(failed)
          )
          print("==============================")

          PY

          python fetch_broker.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/broker_live.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Update live broker data"
            git push
          fi
