name: Update OHLCV

on:
  workflow_dispatch:

  schedule:
    # 00:15 WIB setiap hari
    - cron: "15 17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ambil semua emiten IDX dan OHLCV
        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}

        run: |

          python3 - <<'PY'

          import requests
          import json
          import os
          import string
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          API_KEY = os.environ["API_KEY"]

          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }

          os.makedirs("data", exist_ok=True)

          print("")
          print("======================================")
          print("MULTIBAGGER HUNTER")
          print("UPDATE SEMUA EMITEN IDX")
          print("======================================")
          print("")

          # ==========================================
          # 1. CARI SEMUA EMITEN
          # ==========================================

          print("[1/3] Mencari semua emiten IDX...")
          print("")

          codes = set()
          stocks = {}

          for letter in string.ascii_uppercase:

              try:

                  r = requests.get(
                      f"{BASE}/api/search",
                      headers=HEADERS,
                      params={"q": letter},
                      timeout=60
                  )

                  print(
                      f"Search {letter}: HTTP {r.status_code}"
                  )

                  if r.status_code != 200:
                      continue

                  data = r.json()

                  if not isinstance(data, list):
                      continue

                  for item in data:

                      if not isinstance(item, dict):
                          continue

                      code = item.get("stock_code")

                      if not isinstance(code, str):
                          continue

                      code = code.strip().upper()

                      if (
                          2 <= len(code) <= 5
                          and code.isalpha()
                      ):

                          codes.add(code)

                          stocks[code] = item

              except Exception as e:

                  print(
                      f"GAGAL SEARCH {letter}: {e}"
                  )

              time.sleep(0.2)

          codes = sorted(codes)

          print("")
          print("======================================")
          print("TOTAL EMITEN DITEMUKAN:", len(codes))
          print("======================================")
          print("")

          print("CONTOH:")
          print(codes[:100])
          print("")

          if len(codes) < 100:

              print(
                  "ERROR: Jumlah emiten terlalu sedikit."
              )

              raise SystemExit(1)

          # Simpan daftar emiten

          with open(
              "data/stocks.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  stocks,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==========================================
          # 2. AMBIL OHLCV
          # ==========================================

          print("[2/3] Mengambil OHLCV...")
          print("")

          result = {}

          def get_history(code):

              try:

                  url = f"{BASE}/api/history/{code}"

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=60
                  )

                  if response.status_code != 200:

                      return (
                          code,
                          None,
                          f"HTTP {response.status_code}"
                      )

                  data = response.json()

                  return (
                      code,
                      data,
                      None
                  )

              except Exception as e:

                  return (
                      code,
                      None,
                      str(e)
                  )

          success = 0
          failed = 0

          # 5 request bersamaan
          with ThreadPoolExecutor(
              max_workers=5
          ) as executor:

              futures = {
                  executor.submit(
                      get_history,
                      code
                  ): code

                  for code in codes
              }

              for i, future in enumerate(
                  as_completed(futures),
                  1
              ):

                  code, data, error = future.result()

                  if data is not None:

                      result[code] = data
                      success += 1

                  else:

                      failed += 1

                      print(
                          f"GAGAL {code}: {error}"
                      )

                  if (
                      i % 25 == 0
                      or i == len(codes)
                  ):

                      print(
                          f"Progress: {i}/{len(codes)} "
                          f"| sukses: {success} "
                          f"| gagal: {failed}"
                      )

          # ==========================================
          # 3. SIMPAN DATA
          # ==========================================

          print("")
          print("[3/3] Menyimpan data...")
          print("")

          with open(
              "data/ohlcv.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("")
          print("======================================")
          print("UPDATE SELESAI")
          print("======================================")
          print("Total emiten :", len(codes))
          print("OHLCV sukses  :", success)
          print("OHLCV gagal   :", failed)
          print("======================================")

          PY

      - name: Commit dan Push Data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ohlcv.json
          git add data/stocks.json

          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit -m "Update all IDX OHLCV data"

            git push

          fi

          echo ""
          echo "======================================"
          echo "PUSH SELESAI"
          echo "======================================"
