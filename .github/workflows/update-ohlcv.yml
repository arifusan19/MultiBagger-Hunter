name: Update OHLCV

on:
  workflow_dispatch:

  schedule:
    # 00:15 WIB setiap hari
    - cron: "15 17 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil semua saham dan OHLCV
        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}
        run: |

          python3 - <<'PY'
          import requests
          import json
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          API_KEY = os.environ["API_KEY"]
          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }

          os.makedirs("data", exist_ok=True)

          print("======================================")
          print("MULTIBAGGER HUNTER - UPDATE OHLCV")
          print("======================================")

          # ==========================================
          # 1. AMBIL DAFTAR SEMUA SAHAM
          # ==========================================

          print("\n[1/3] Mengambil daftar saham...")

          r = requests.get(
              BASE + "/api/market-cap",
              headers=HEADERS,
              timeout=30
          )

          r.raise_for_status()

          market = r.json()

          # Cari semua kode saham secara fleksibel
          codes = set()

          def scan_codes(obj):

              if isinstance(obj, dict):

                  for key, value in obj.items():

                      key_lower = str(key).lower()

                      if key_lower in [
                          "code",
                          "stock_code",
                          "symbol",
                          "ticker"
                      ]:

                          if isinstance(value, str):

                              code = value.strip().upper()

                              if (
                                  2 <= len(code) <= 5
                                  and code.isalpha()
                              ):
                                  codes.add(code)

                      scan_codes(value)

              elif isinstance(obj, list):

                  for item in obj:
                      scan_codes(item)

          scan_codes(market)

          codes = sorted(codes)

          print("Jumlah kode ditemukan:", len(codes))

          if len(codes) < 100:

              print("ERROR: daftar saham terlalu sedikit.")

              print(json.dumps(market, indent=2)[:5000])

              raise SystemExit(1)

          # ==========================================
          # 2. AMBIL HISTORY MASING-MASING SAHAM
          # ==========================================

          print("\n[2/3] Mengambil OHLCV...")

          result = {}

          def get_history(code):

              try:

                  url = f"{BASE}/api/history/{code}"

                  res = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  if res.status_code != 200:

                      return code, None, f"HTTP {res.status_code}"

                  data = res.json()

                  return code, data, None

              except Exception as e:

                  return code, None, str(e)

          success = 0
          failed = 0

          # Maksimal 5 koneksi bersamaan
          with ThreadPoolExecutor(max_workers=5) as executor:

              futures = [
                  executor.submit(get_history, code)
                  for code in codes
              ]

              for i, future in enumerate(as_completed(futures), 1):

                  code, data, error = future.result()

                  if data is not None:

                      result[code] = data

                      success += 1

                  else:

                      failed += 1

                      print(
                          f"GAGAL {code}: {error}"
                      )

                  if i % 50 == 0 or i == len(codes):

                      print(
                          f"Progress: {i}/{len(codes)} "
                          f"| sukses {success} "
                          f"| gagal {failed}"
                      )

          # ==========================================
          # 3. SIMPAN DATA
          # ==========================================

          print("\n[3/3] Menyimpan data...")

          with open(
              "data/ohlcv.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("\n======================================")
          print("SELESAI")
          print("Total saham :", len(codes))
          print("Berhasil     :", success)
          print("Gagal        :", failed)
          print("File         : data/ohlcv.json")
          print("======================================")

          PY

      - name: Commit data OHLCV
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ohlcv.json

          git diff --cached --quiet || \
            git commit -m "Update OHLCV data"

          git push
