name: Update OHLCV

on:
  workflow_dispatch:

  schedule:
    - cron: "15 17 * * *"

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout
        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ============================================
      # AMBIL DATA IDX
      # ============================================

      - name: Ambil 963 Emiten IDX + OHLCV

        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}

        run: |

          python3 - <<'PY'

          import requests
          import json
          import os
          import time


          # ============================================
          # KONFIGURASI
          # ============================================

          API_KEY = os.environ["API_KEY"]

          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }


          os.makedirs("data", exist_ok=True)


          print("")
          print("==========================================")
          print("MULTIBAGGER HUNTER")
          print("UPDATE SEMUA EMITEN IDX")
          print("==========================================")
          print("")


          # ============================================
          # BAGIAN 1
          # AMBIL SEMUA EMITEN
          # ============================================

          print("[1/3] Mengambil seluruh emiten IDX...")
          print("")


          try:

              response = requests.get(
                  f"{BASE}/api/market-cap",
                  headers=HEADERS,
                  params={"page": 1},
                  timeout=60
              )

          except Exception as e:

              print("ERROR:", e)
              raise SystemExit(1)


          if response.status_code != 200:

              print(
                  "ERROR MARKET CAP:",
                  response.status_code
              )

              print(response.text[:2000])

              raise SystemExit(1)


          first = response.json()


          total = int(
              first.get("total", 0)
          )

          total_pages = int(
              first.get("total_pages", 0)
          )

          per_page = int(
              first.get("per_page", 0)
          )


          print("TOTAL EMITEN :", total)
          print("PER PAGE     :", per_page)
          print("TOTAL PAGE   :", total_pages)
          print("")


          if total_pages < 1:

              print(
                  "ERROR: total_pages tidak ditemukan."
              )

              raise SystemExit(1)


          stocks = {}


          # ============================================
          # PAGE 1
          # ============================================

          rows = first.get("data", [])


          for item in rows:

              code = item.get("code")

              if code:

                  code = code.strip().upper()

                  stocks[code] = item


          print(
              f"Page 1/{total_pages} selesai | "
              f"+{len(rows)} | "
              f"total unik: {len(stocks)}"
          )


          # ============================================
          # PAGE 2 SAMPAI TERAKHIR
          # ============================================

          for page in range(
              2,
              total_pages + 1
          ):

              success_page = False


              for attempt in range(1, 6):

                  try:

                      response = requests.get(
                          f"{BASE}/api/market-cap",
                          headers=HEADERS,
                          params={"page": page},
                          timeout=60
                      )


                      if response.status_code == 200:

                          data = response.json()

                          rows = data.get(
                              "data",
                              []
                          )


                          for item in rows:

                              code = item.get(
                                  "code"
                              )

                              if code:

                                  code = (
                                      code
                                      .strip()
                                      .upper()
                                  )

                                  stocks[code] = item


                          print(
                              f"Page {page}/{total_pages} "
                              f"selesai | "
                              f"+{len(rows)} | "
                              f"total unik: "
                              f"{len(stocks)}"
                          )


                          success_page = True

                          break


                      elif response.status_code == 429:

                          wait = 10 * attempt

                          print(
                              f"RATE LIMIT PAGE {page} "
                              f"| retry {attempt}/5 "
                              f"| tunggu {wait} detik"
                          )

                          time.sleep(wait)


                      else:

                          print(
                              f"GAGAL PAGE {page}: "
                              f"HTTP "
                              f"{response.status_code}"
                          )

                          break


                  except Exception as e:

                      print(
                          f"ERROR PAGE {page}: "
                          f"{e}"
                      )

                      time.sleep(
                          5 * attempt
                      )


              if not success_page:

                  print(
                      f"WARNING: PAGE {page} "
                      f"tidak berhasil."
                  )


              time.sleep(1)


          codes = sorted(
              stocks.keys()
          )


          # ============================================
          # HASIL EMITEN
          # ============================================

          print("")
          print("==========================================")
          print("HASIL DAFTAR EMITEN")
          print("==========================================")
          print("Target API       :", total)
          print("Emiten ditemukan :", len(codes))
          print("==========================================")
          print("")


          if len(codes) < 900:

              print(
                  "ERROR: jumlah emiten "
                  "kurang dari 900."
              )

              raise SystemExit(1)


          # ============================================
          # SIMPAN STOCKS
          # ============================================

          with open(
              "data/stocks.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  stocks,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          # ============================================
          # SIMPAN MARKET CAP
          # ============================================

          with open(
              "data/market_cap_raw.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  stocks,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          # ============================================
          # BAGIAN 2
          # AMBIL HISTORY / OHLCV
          # ============================================

          print("")
          print(
              "[2/3] Mengambil OHLCV "
              "seluruh emiten..."
          )
          print("")

          print(
              "MODE: 1 REQUEST SEKALIGUS"
          )

          print(
              "RATE LIMIT PROTECTION: AKTIF"
          )

          print("")


          result = {}

          success = 0

          failed = 0


          # ============================================
          # FUNGSI HISTORY
          # ============================================

          def get_history(code):

              max_retry = 8


              for attempt in range(
                  1,
                  max_retry + 1
              ):

                  try:

                      response = requests.get(
                          f"{BASE}/api/history/{code}",
                          headers=HEADERS,
                          timeout=60
                      )


                      # ----------------------------
                      # BERHASIL
                      # ----------------------------

                      if response.status_code == 200:

                          return (
                              code,
                              response.json(),
                              None
                          )


                      # ----------------------------
                      # RATE LIMIT
                      # ----------------------------

                      if response.status_code == 429:

                          retry_after = (
                              response.headers
                              .get("Retry-After")
                          )


                          if retry_after:

                              try:

                                  wait = int(
                                      retry_after
                                  )

                              except:

                                  wait = 10

                          else:

                              wait = min(
                                  10 * attempt,
                                  60
                              )


                          print(
                              f"429 {code} | "
                              f"retry "
                              f"{attempt}/{max_retry} | "
                              f"tunggu "
                              f"{wait} detik"
                          )


                          time.sleep(wait)

                          continue


                      # ----------------------------
                      # ERROR LAIN
                      # ----------------------------

                      return (
                          code,
                          None,
                          f"HTTP "
                          f"{response.status_code}"
                      )


                  except Exception as e:

                      print(
                          f"ERROR {code}: "
                          f"{e}"
                      )


                      if attempt < max_retry:

                          wait = min(
                              5 * attempt,
                              30
                          )

                          time.sleep(
                              wait
                          )

                      else:

                          return (
                              code,
                              None,
                              str(e)
                          )


              return (
                  code,
                  None,
                  "Gagal setelah retry"
              )


          # ============================================
          # AMBIL SATU PER SATU
          # ============================================

          for i, code in enumerate(
              codes,
              1
          ):

              code_result, data, error = (
                  get_history(code)
              )


              if data is not None:

                  result[code_result] = data

                  success += 1


              else:

                  failed += 1

                  print(
                      f"GAGAL {code_result}: "
                      f"{error}"
                  )


              # ----------------------------------------
              # LAPORAN PROGRESS
              # ----------------------------------------

              if (
                  i % 25 == 0
                  or i == len(codes)
              ):

                  print("")

                  print(
                      f"Progress: "
                      f"{i}/{len(codes)} | "
                      f"sukses: {success} | "
                      f"gagal: {failed}"
                  )

                  print("")


              # ----------------------------------------
              # JEDA ANTAR REQUEST
              # ----------------------------------------

              time.sleep(1)


          # ============================================
          # BAGIAN 3
          # SIMPAN OHLCV
          # ============================================

          print("")
          print("[3/3] Menyimpan data...")
          print("")


          with open(
              "data/ohlcv.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          # ============================================
          # HASIL AKHIR
          # ============================================

          print("")
          print("==========================================")
          print("UPDATE SELESAI")
          print("==========================================")
          print("Total emiten :", len(codes))
          print("OHLCV sukses  :", success)
          print("OHLCV gagal   :", failed)
          print("==========================================")
          print("")


          if success < 900:

              print(
                  "WARNING: OHLCV sukses "
                  "kurang dari 900."
              )

          else:

              print(
                  "✅ OHLCV 900+ BERHASIL"
              )


          PY


      # ============================================
      # COMMIT DATA
      # ============================================

      - name: Commit dan Push Data

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ohlcv.json
          git add data/stocks.json
          git add data/market_cap_raw.json


          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "Update all IDX OHLCV data"

            git push

          fi


          echo ""
          echo "=========================================="
          echo "PUSH SELESAI"
          echo "=========================================="
