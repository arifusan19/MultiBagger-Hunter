name: Update OHLCV

on:
  workflow_dispatch:

  schedule:
    - cron: "15 17 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Ambil 963 Emiten IDX + OHLCV
        env:
          API_KEY: ${{ secrets.IDX_EDGE_API_KEY }}

        run: |

          python3 - <<'PY'

          import requests
          import json
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed


          API_KEY = os.environ["API_KEY"]

          BASE = "https://stock.arjum.com"

          HEADERS = {
              "X-API-Key": API_KEY,
              "Accept": "application/json"
          }


          os.makedirs("data", exist_ok=True)


          print("")
          print("======================================")
          print("MULTIBAGGER HUNTER")
          print("UPDATE SEMUA EMITEN IDX")
          print("======================================")
          print("")


          # ==================================================
          # 1. AMBIL SEMUA EMITEN DARI MARKET CAP
          # ==================================================

          print("[1/3] Mengambil daftar seluruh emiten IDX...")
          print("")


          first_url = f"{BASE}/api/market-cap"

          r = requests.get(
              first_url,
              headers=HEADERS,
              params={"page": 1},
              timeout=60
          )


          if r.status_code != 200:
              print("ERROR MARKET CAP:", r.status_code)
              print(r.text[:2000])
              raise SystemExit(1)


          first = r.json()


          total = int(first.get("total", 0))
          total_pages = int(first.get("total_pages", 0))
          per_page = int(first.get("per_page", 0))


          print("TOTAL EMITEN :", total)
          print("PER PAGE     :", per_page)
          print("TOTAL PAGE   :", total_pages)
          print("")


          if total_pages < 1:
              print("ERROR: total_pages tidak ditemukan.")
              raise SystemExit(1)


          stocks = {}
          market_cap_data = []


          # halaman pertama
          for item in first.get("data", []):

              code = item.get("code")

              if code:
                  code = code.strip().upper()

                  stocks[code] = item
                  market_cap_data.append(item)


          print(
              f"Page 1/{total_pages} selesai | "
              f"{len(first.get('data', []))} emiten"
          )


          # halaman berikutnya
          for page in range(2, total_pages + 1):

              try:

                  response = requests.get(
                      f"{BASE}/api/market-cap",
                      headers=HEADERS,
                      params={"page": page},
                      timeout=60
                  )


                  if response.status_code != 200:

                      print(
                          f"GAGAL PAGE {page}: "
                          f"HTTP {response.status_code}"
                      )

                      continue


                  data = response.json()


                  rows = data.get("data", [])


                  for item in rows:

                      code = item.get("code")

                      if code:

                          code = code.strip().upper()

                          stocks[code] = item
                          market_cap_data.append(item)


                  print(
                      f"Page {page}/{total_pages} selesai | "
                      f"+{len(rows)} | "
                      f"total unik: {len(stocks)}"
                  )


              except Exception as e:

                  print(
                      f"GAGAL PAGE {page}: {e}"
                  )


              time.sleep(0.2)


          codes = sorted(stocks.keys())


          print("")
          print("======================================")
          print("HASIL DAFTAR EMITEN")
          print("======================================")
          print("Total API       :", total)
          print("Total ditemukan :", len(codes))
          print("======================================")
          print("")


          if len(codes) < 900:

              print(
                  "ERROR: jumlah emiten kurang dari 900."
              )

              print(
                  "Tidak melanjutkan pengambilan OHLCV."
              )

              raise SystemExit(1)


          # ==================================================
          # SIMPAN STOCKS
          # ==================================================

          with open(
              "data/stocks.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  stocks,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          # ==================================================
          # SIMPAN MARKET CAP
          # ==================================================

          market_cap_unique = {}

          for item in market_cap_data:

              code = item.get("code")

              if code:

                  code = code.strip().upper()

                  market_cap_unique[code] = item


          with open(
              "data/market_cap_raw.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  market_cap_unique,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          print("")
          print("[2/3] Mengambil OHLCV seluruh emiten...")
          print("")


          # ==================================================
          # 2. AMBIL HISTORY
          # ==================================================

          result = {}

          success = 0
          failed = 0


          def get_history(code):

              try:

                  response = requests.get(
                      f"{BASE}/api/history/{code}",
                      headers=HEADERS,
                      timeout=60
                  )


                  if response.status_code != 200:

                      return (
                          code,
                          None,
                          f"HTTP {response.status_code}"
                      )


                  data = response.json()


                  return (
                      code,
                      data,
                      None
                  )


              except Exception as e:

                  return (
                      code,
                      None,
                      str(e)
                  )


          # Jangan terlalu agresif supaya API aman
          MAX_WORKERS = 5


          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:


              futures = {

                  executor.submit(
                      get_history,
                      code
                  ): code

                  for code in codes

              }


              for i, future in enumerate(
                  as_completed(futures),
                  1
              ):


                  code, data, error = (
                      future.result()
                  )


                  if data is not None:

                      result[code] = data

                      success += 1


                  else:

                      failed += 1

                      print(
                          f"GAGAL {code}: {error}"
                      )


                  if (
                      i % 25 == 0
                      or i == len(codes)
                  ):

                      print(
                          f"Progress: "
                          f"{i}/{len(codes)} | "
                          f"sukses: {success} | "
                          f"gagal: {failed}"
                      )


          # ==================================================
          # 3. SIMPAN OHLCV
          # ==================================================

          print("")
          print("[3/3] Menyimpan data...")
          print("")


          with open(
              "data/ohlcv.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


          print("")
          print("======================================")
          print("UPDATE SELESAI")
          print("======================================")
          print("Total emiten :", len(codes))
          print("OHLCV sukses  :", success)
          print("OHLCV gagal   :", failed)
          print("======================================")
          print("")


          if success < 900:

              print(
                  "WARNING: OHLCV sukses kurang dari 900."
              )

          PY


      - name: Commit dan Push Data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/ohlcv.json
          git add data/stocks.json
          git add data/market_cap_raw.json


          if git diff --cached --quiet; then

            echo "Tidak ada perubahan data."

          else

            git commit \
              -m "Update all IDX OHLCV data"

            git push

          fi


          echo ""
          echo "======================================"
          echo "PUSH SELESAI"
          echo "======================================"
